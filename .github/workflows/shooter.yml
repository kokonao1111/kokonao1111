name: Shooter game

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# 同時に複数の Issue が来ても、1手ずつ順番に処理する
concurrency:
  group: shooter-game
  cancel-in-progress: false

jobs:
  play:
    if: startsWith(github.event.issue.title, 'shooter:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # タイトルは外部の誰でも書ける値なので、シェルに展開せず環境変数で渡す
      - name: Apply move
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_ACTOR: ${{ github.event.issue.user.login }}
        run: node scripts/shooter-game.mjs

      - name: Commit board
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update shooter board
          file_pattern: README.md assets/shooter-board.svg assets/shooter-state.json

      - name: Close issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --comment "反映しました。プロフィールを再読み込みしてください（画像のキャッシュが残る場合は数十秒お待ちください）。"
